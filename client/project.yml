name: Hylete
options:
  bundleIdPrefix: com.hyleteapp
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: "minimal"
targets:
  Hylete:
    type: application
    platform: iOS
    sources:
      - path: Hylete
        # Only the 18pt static weights (Regular / Medium / SemiBold /
        # Bold) ship in the app bundle. The full Inter download
        # also includes 24pt + 28pt optical sizes, the variable
        # fonts, the italic variants, and the heavier weights —
        # all kept in `Fonts/Inter/` for reference but excluded
        # from the bundle to keep the IPA small. The matching
        # PostScript names (`Inter18pt-*`) are hard-coded in
        # `Typography.swift` and the matching filenames in the
        # `UIAppFonts` block below.
        excludes:
          - "DesignSystem/Fonts/Inter/static/**/Inter_24pt*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_28pt*"
          - "DesignSystem/Fonts/Inter/Inter-*VariableFont*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_*Italic*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_18pt-Thin*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_18pt-ExtraLight*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_18pt-Light*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_18pt-ExtraBold*"
          - "DesignSystem/Fonts/Inter/static/**/Inter_18pt-Black*"
          - "DesignSystem/Fonts/Inter/OFL.txt"
          - "DesignSystem/Fonts/Inter/README.txt"
    # Entitlements: CODE_SIGN_ENTITLEMENTS (in settings below)
    # points at a HAND-MAINTAINED plist. Do NOT use XcodeGen's
    # `entitlements:` key for this target — xcodegen rewrites
    # that file on every `make gen`, silently dropping the
    # HealthKit key (proven with checksums: this broke HealthKit
    # auth twice before the cause was found). With only the
    # build setting referencing it, neither `make gen` nor the
    # build touches the file's contents. Read-only Apple Health
    # vitals (display-only, no workouts).
    # Fails the build early when the HealthKit entitlement goes
    # missing from Hylete.entitlements (Xcode's Signing &
    # Capabilities editor has stripped it before). Without the
    # key the app still compiles but every HealthKit
    # authorization throws at runtime and the Health link fails
    # silently — this turns that into a loud build error naming
    # the fix instead.
    preBuildScripts:
      - script: |
          if ! grep -q "com.apple.developer.healthkit" "${SRCROOT}/Hylete/Hylete.entitlements"; then
            echo "error: Hylete/Hylete.entitlements is missing the com.apple.developer.healthkit key. HealthKit authorization will fail at runtime. Re-add the HealthKit capability (Signing & Capabilities) or restore the file, then rebuild."
            exit 1
          fi
        name: Verify HealthKit entitlement
        # Declared input doubles as a sandbox read grant:
        # ENABLE_USER_SCRIPT_SANDBOXING is on, so without this
        # the grep sees nothing and the check false-fails.
        inputFiles:
          - Hylete/Hylete.entitlements
    info:
      path: Hylete/Info.plist
      properties:
        # Read-only Apple Health vitals (display-only, no workouts).
        # Only the share (read) key is declared — there is no
        # NSHealthUpdateUsageDescription because the app never
        # writes to HealthKit. Wrapped behind BetaFeature until
        # validated.
        NSHealthShareUsageDescription: Hylete reads steps, heart rate, and body measurements from Apple Health to show your daily activity alongside your workouts.
        # Resolved per build configuration from the xcconfig
        # files (Hylete/Configs/*.xcconfig): "Hylete Dev" in
        # Debug, "Hylete" in Release — so dev and prod installs
        # are distinguishable on the home screen.
        CFBundleDisplayName: $(HYLETE_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
        # Inter (web's brand sans). Static 18pt weights from
        # client/Hylete/DesignSystem/Fonts/Inter/static/ — see
        # Typography.swift for the matching PostScript names.
        UIAppFonts:
          - Inter_18pt-Regular.ttf
          - Inter_18pt-Medium.ttf
          - Inter_18pt-SemiBold.ttf
          - Inter_18pt-Bold.ttf
        HYLETE_API_BASE_URL: $(HYLETE_API_SCHEME)://$(HYLETE_API_HOST)$(HYLETE_API_PATH)
    # Per-build-configuration xcconfig files. XcodeGen
    # attaches these to the target so every build pulls the
    # matching HYLETE_API_BASE_URL out of Info.plist via the
    # `$(HYLETE_API_BASE_URL)` reference above. Debug keeps
    # the localhost dev server (simulator-only); Release
    # points at the production HTTPS server for on-device
    # installs.
    configFiles:
      Debug: Hylete/Configs/Debug.xcconfig
      Release: Hylete/Configs/Release.xcconfig
    settings:
      base:
        # NOTE: PRODUCT_BUNDLE_IDENTIFIER is intentionally NOT
        # set here. Direct target build settings override
        # xcconfig files, so pinning it here would defeat the
        # per-configuration split (com.hyleteapp.hylete.dev in
        # Debug vs com.hyleteapp.hylete in Release) defined in
        # Hylete/Configs/{Debug,Release}.xcconfig.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # HealthKit entitlement source file (hand-maintained —
        # see the note above `info:`). CODE_SIGN_ENTITLEMENTS is
        # safe here (unlike the bundle ID above) because no
        # xcconfig sets it, so there is nothing to override.
        CODE_SIGN_ENTITLEMENTS: Hylete/Hylete.entitlements
  # Hosted unit-test bundle. Runs against the app target so
  # tests can exercise DesignSystem helpers (CalendarMath) and
  # any future logic that doesn't need a running server.
  HyleteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HyleteTests
    dependencies:
      - target: Hylete
    settings:
      base:
        # The app target disables generated plists (it ships a
        # hand-maintained one); the test bundle has no plist of
        # its own, so let Xcode synthesise a minimal one.
        GENERATE_INFOPLIST_FILE: YES
# Two shared schemes over the same targets. The environment
# split comes from the build configuration each action uses:
#
#   Dev  — the daily driver. Run/Test use Debug, which pulls
#          Hylete/Configs/Debug.xcconfig: localhost dev server,
#          com.hyleteapp.hylete.dev bundle ID, "Hylete Dev" name.
#   Prod — the ship lane. Run/Profile/Archive use Release
#          (Configs/Release.xcconfig): production HTTPS server,
#          com.hyleteapp.hylete, "Hylete". Run = Release here means
#          you can smoke-test against the live API on a
#          simulator before archiving.
#
# Schemes MUST be declared here (not hand-added in Xcode) —
# Hylete.xcodeproj is gitignored and regenerated wholesale by
# XcodeGen; anything defined only in the project file is lost
# on `make gen`.
schemes:
  Dev:
    build:
      targets:
        Hylete: all
        HyleteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - HyleteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      # Archiving from Dev still yields a production build.
      # Shipping should go through the Prod scheme or
      # `make release`; this is only a safety net so an
      # accidental archive is never a localhost build.
      config: Release
  Prod:
    build:
      targets:
        Hylete: all
        HyleteTests: [test]
    run:
      # Release config → production server. Lets you launch
      # the real app against www.hyleteapp.com without going
      # through an archive + device install first.
      config: Release
    test:
      # Tests always run against Debug — they need the test
      # bundle and don't care which server the app points at.
      config: Debug
      gatherCoverageData: false
      targets:
        - HyleteTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
